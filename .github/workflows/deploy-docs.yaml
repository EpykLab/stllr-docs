# deploy to fly.io
name: Deploy docs to Fly.io

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  validate:
    name: Validate MkDocs site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install --requirement requirements.lock

      - name: Build documentation
        run: mkdocs build --strict

      - name: Verify preserved URLs
        run: python scripts/check_urls.py

      - name: Build production image
        run: docker build --tag stllr-docs:test .

      - name: Smoke-test production image
        run: |
          docker run --detach --name stllr-docs-test --publish 127.0.0.1:8080:8080 stllr-docs:test
          trap 'docker rm --force stllr-docs-test' EXIT
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:8080/docs/ > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/docs/ > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/)" = "307"
          test "$(curl --silent --head http://127.0.0.1:8080/ | awk '/^Location:/ { print $2 }' | tr -d '\r')" = "/docs/"
          curl --fail --silent http://127.0.0.1:8080/robots.txt > /dev/null
          curl --fail --silent http://127.0.0.1:8080/sitemap.xml > /dev/null
          curl --fail --silent http://127.0.0.1:8080/api/docs/nav > /dev/null
          curl --fail --silent http://127.0.0.1:8080/api/docs/search-index > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:8080/api/docs/chat)" = "503"

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    concurrency:
      group: deploy-docs
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
