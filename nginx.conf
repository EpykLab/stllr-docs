server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    location = / {
        return 307 /docs/;
    }

    location = /api/docs/nav {
        default_type application/json;
        alias /usr/share/nginx/html/compat/nav.json;
    }

    location = /api/docs/search-index {
        default_type application/json;
        alias /usr/share/nginx/html/compat/search-index.json;
    }

    location = /api/docs/chat {
        default_type application/json;
        return 503 '{"error":"Chat is unavailable during the MkDocs migration"}';
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
